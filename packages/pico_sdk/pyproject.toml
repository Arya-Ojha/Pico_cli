[project]
name = "pico-cli-sdk"
version = "0.1.0"
description = "Headless library API and extension/plugin binding."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arya-Ojha", email = "aryaojha195@gmail.com" }]
keywords = ["cli", "ai-agent", "coding-assistant", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = ["pico-core", "pico-ai", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Repository = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Issues = "https://github.com/Arya-Ojha/PicoCLI_Learn/issues"

# Note: the `picoCLI` entry point lives on the `pico-cli` meta-package only,
# so installing the stack never ships duplicate console scripts.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_sdk"]

[tool.uv.sources]
pico-core = { workspace = true }
pico-ai = { workspace = true }
