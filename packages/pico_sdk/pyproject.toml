[project]
name = "pico-sdk"
version = "0.1.0"
description = "Headless library API and extension/plugin binding."
requires-python = ">=3.12"
dependencies = ["pico-core", "pico-ai", "pydantic>=2"]

[project.scripts]
picoCLI = "pico_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_sdk"]

[tool.uv.sources]
pico-core = { workspace = true }
pico-ai = { workspace = true }
