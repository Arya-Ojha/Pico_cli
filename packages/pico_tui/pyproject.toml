[project]
name = "pico-tui"
version = "0.1.0"
description = "Terminal user interface view."
requires-python = ">=3.12"
dependencies = [
    "pico-sdk",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
picoCLI-chat = "pico_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_tui"]

[tool.uv.sources]
pico-sdk = { workspace = true }
