[project]
name = "pico-tui"
version = "0.1.0"
description = "Terminal user interface view."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arya-Ojha", email = "aryaojha195@gmail.com" }]
keywords = ["tui", "terminal", "textual", "cli", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "pico-cli-sdk",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Repository = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Issues = "https://github.com/Arya-Ojha/PicoCLI_Learn/issues"

# Note: the `picoCLI-chat` entry point lives on the `pico-cli`
# meta-package only, so installing the stack never ships duplicate
# console scripts.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_tui"]

[tool.uv.sources]
pico-cli-sdk = { workspace = true }
