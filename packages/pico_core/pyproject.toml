[project]
name = "pico-core"
version = "0.1.0"
description = "Agent loop and session tree."
requires-python = ">=3.12"
dependencies = ["pico-ai", "pydantic>=2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_core"]

[tool.uv.sources]
pico-ai = { workspace = true }
