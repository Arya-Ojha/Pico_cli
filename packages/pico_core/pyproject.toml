[project]
name = "pico-cli-core"
version = "0.1.2"
description = "Agent loop and session tree."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arya-Ojha", email = "aryaojha195@gmail.com" }]
keywords = ["ai-agent", "agent-loop", "llm-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = ["pico-cli-ai", "pydantic>=2", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Repository = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Issues = "https://github.com/Arya-Ojha/PicoCLI_Learn/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_core"]

[tool.uv.sources]
pico-cli-ai = { workspace = true }
