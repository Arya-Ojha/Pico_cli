[project]
name = "pico-cli"
version = "0.1.1"
description = "A Python CLI coding agent — autonomous, tool-using, and session-persistent."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arya-Ojha", email = "aryaojha195@gmail.com" }]
keywords = ["cli", "ai-agent", "coding-assistant", "tui", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = ["pico-cli-sdk", "pico-cli-tui"]

[project.urls]
Homepage = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Repository = "https://github.com/Arya-Ojha/PicoCLI_Learn"
Issues = "https://github.com/Arya-Ojha/PicoCLI_Learn/issues"

[project.scripts]
picocli-chat = "pico_sdk.cli:main"
picocli = "pico_tui.app:main"

# The root `pico` dist is a meta-package: the implementation lives in the
# workspace members, so the wheel ships the stub above plus metadata
# (dependencies + entry points) only.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pico-cli-sdk = { workspace = true }
pico-cli-tui = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
