[project]
name = "pico"
version = "0.1.0"
description = "A Python CLI coding agent inspired by Pi's modular architecture."
requires-python = ">=3.12"
dependencies = ["pico-sdk", "pico-tui"]

[project.scripts]
picoCLI = "pico_sdk.cli:main"
picoCLI-chat = "pico_tui.app:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pico-sdk = { workspace = true }
pico-tui = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
